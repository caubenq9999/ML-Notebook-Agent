# Paste these values into Streamlit Community Cloud > App settings > Secrets.
# Never commit a real .streamlit/secrets.toml file.

APP_PASSWORD = "replace-with-a-strong-demo-password"
NOTEBOOKFORGE_ALLOW_PUBLIC = false

DEEPSEEK_API_KEY = "replace-with-your-deepseek-api-key"
NOTEBOOKFORGE_PROVIDER = "deepseek"
NOTEBOOKFORGE_MODEL = "deepseek-v4-flash"
NOTEBOOKFORGE_MODEL_JUDGE = "deepseek-v4-pro"
NOTEBOOKFORGE_DEEPSEEK_THINKING = "disabled"
NOTEBOOKFORGE_NOTEBOOK_MAX_TOKENS = "10000"
NOTEBOOKFORGE_MAX_TOKENS = "16000"
NOTEBOOKFORGE_LLM_RETRIES = "3"
NOTEBOOKFORGE_CELL_TIMEOUT = "120"
NOTEBOOKFORGE_UI_ALLOW_MOCK_FALLBACK = "0"
